version: '3.8'

services:
  nginx:
    build: ./frontend
    container_name: secure-transfer-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
  backend:
    build: ./backend
    container_name: secure-transfer-backend
    volumes:
      - ./backend:/app
    restart: always
    depends_on:
      - redis
      - clamav
    env_file:
      - ./.env
    environment:
      - REDIS_HOST=redis
      - CLAMAV_HOST=clamav
      
  redis:
    image: redis:alpine
    container_name: secure-transfer-redis
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: secure-transfer-clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false
