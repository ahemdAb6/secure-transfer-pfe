version: '3.8'

services:
  # 1. Frontend (Nginx)
  nginx:
    build: ./frontend
    container_name: secure-transfer-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend

  # 2. Backend (Python API)
  backend:
    build: ./backend
    container_name: secure-transfer-backend
    volumes:
      - ./backend:/app
    restart: always
    depends_on:
      - redis
      - clamav
      - ollama
    
    # 👇 THIS IS THE FIX: Load all variables from your .env file
    env_file:
      - .env

    environment:
      - REDIS_HOST=redis
      - CLAMAV_HOST=clamav
      - OLLAMA_HOST=http://ollama:11434
      # I removed the manual SMTP lines because 'env_file' loads them automatically now!

  # 3. AI Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: secure_ai_brain
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  # 4. Redis
  redis:
    image: redis:alpine
    container_name: secure-transfer-redis
    restart: always

  # 5. ClamAV
  clamav:
    image: clamav/clamav:latest
    container_name: secure-transfer-clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false

volumes:
  ollama_data: